name: The base was not enough
description: Your agent read the base and it did not help enough. Tell us what was missing.
title: "base-not-enough: "
labels: ["base-not-enough"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public on GitHub. Do not paste code, file paths, names or anything else from a
        private repo, and do not paste your agent's report: describe in your own words. There is no
        turnaround promise; see the README's Support section.
  - type: textarea
    id: reported
    attributes:
      label: Which cards the agent reported
      description: The card titles from the index and what the agent said about each. The audit prompt gives holds, does not hold or cannot tell; the interview prompt gives in place, gap or later. Say which prompt you used, and add whether it proposed a fix for a card, or skipped it, if you have that.
    validations:
      required: true
  - type: textarea
    id: missed
    attributes:
      label: Which practice you missed
      description: A practice you needed that no card covers, or a card that is there but did not fit your case. Say what happened, without private details.
    validations:
      required: true
